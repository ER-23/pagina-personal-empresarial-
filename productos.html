<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Productos | Arcadex</title>
        <link rel="stylesheet" href="prueba.css">
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <header>
            <h1>Gestion de productos</h1>
            <p>
                Espacio para gestionar los productos registrados en la tienda. <br>
                Use los botones para <strong>añadir</strong>, <strong>editar</strong>, 
                o <strong>eliminar</strong> productos.
            </p>
        </header>

        <main>
            <p>Hola</p>

            <button onclick="abrirPopup()">Añadir producto</button>

            <article id="popup" class="popup">
                <form class="popup-contenido">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" required>

                    <label for="cantidad">Cantidad</label>
                    <input type="number" id="cantidad" required>

                    <label>Tipo de producto</label>
                    <div class="opciones-radio">
                        <label>
                            <input type="radio" name="tipo" value="juegos" required>Videojuegos
                        </label>

                        <label>
                            <input type="radio" name="tipo" value="consola">Consolas
                        </label>
                        
                        <label>
                            <input type="radio" name="tipo" value="accesorio">Accesorios
                        </label>
                    </div>
                    
                    <button type="submit">Enviar</button>
                    <button onclick="cerrarPopup()">Cerrar</button>
                </form>
            </article>

            <article class="lista-elementos">
                
            </article>
        </main>

        <footer>
            <section id="redes">
                <h2>Nuestras redes sociales</h2>
                <a href="https://www.facebook.com/profile.php?id=61595732810169"><img class="redes-img" src="Imagenes/FacebookLogo.png" alt="Imagen de facebook"></a>
                <a href="https://www.tiktok.com/@arcadex_gaming"><img class="redes-img" src="Imagenes/TiktokLogo.png" alt="Imagen de Youtube"></a>
                <a href="http://www.youtube.com/@Arcadex-GG"><img class="redes-img" src="Imagenes/YoutubeLogo.png" alt="Imagen de Tiktok"></a>
            </section>
            <p>&copy; Arcadex 2026. Todos los derechos reservados.</p>
        </footer>
    </body>

    <script src="app.js"></script>
</html>
